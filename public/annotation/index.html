<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Annotation Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="top-navbar">
            <div class="nav-group">
                <button id="uploadBtn" title="Upload Image"><i class="fas fa-upload"></i> Upload</button>
                <input type="file" id="imageLoader" name="imageLoader" accept="image/*" style="display:none;" multiple />
                <button id="cameraBtn" title="Use Camera"><i class="fas fa-camera"></i> Camera</button>
                <button id="captureBtn" style="display: none;">Capture</button>
                <button id="undoBtn" title="Undo"><i class="fas fa-undo"></i></button>
                <button id="redoBtn" title="Redo"><i class="fas fa-redo"></i></button>
                <button id="resetBtn" title="Reset Annotations"><i class="fas fa-eraser"></i></button>
                <button id="saveBtn" title="Save"><i class="fas fa-save"></i> Save</button>
                <button id="helpBtn" title="Help"><i class="fas fa-question-circle"></i> Help</button>
            </div>
        </div>
        <div class="main-layout">
            <div class="content-area">
                <div class="canvas-container">
                    <canvas id="annotationCanvas"></canvas>
                    <video id="cameraFeed" style="display: none;"></video>
                </div>
                <div class="thumbnail-container">
                    <button id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                    <div class="thumbnail-bar" id="thumbnailBar"></div>
                    <button id="nextBtn"><i class="fas fa-chevron-right"></i></button>
                    <button id="deleteBtn"><i class="fas fa-trash-alt"></i> Delete</button>
                </div>
            </div>
            <div class="controls-container">
                <h2>Controls</h2>
                <div class="button-group">
                    <button id="autoAnnotateBtn">Auto-annotate</button>
                    <button id="autoAnnotateAllBtn">Annotate All</button>
                </div>
                <div class="labels-section">
                    <h3>Labels.txt Preview</h3>
                    <pre id="labelsPreview"></pre>
                    <h3>Project Labels</h3>
                    <div id="projectLabels"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="app.js"></script>

    <!-- Custom Dialog for Labeling -->
    <div id="labelDialog" class="label-dialog" style="display: none;">
        <input type="text" id="labelInput" placeholder="Enter or select label..." autocomplete="off">
        <ul id="labelList"></ul>
        <div id="colorPickerContainer" style="display: none;">
            <label for="colorPicker">Choose a color:</label>
            <input type="color" id="colorPicker" value="#ff0000">
        </div>
        <div class="dialog-buttons">
            <button id="saveLabelBtn">Save</button>
            <button id="cancelLabelBtn">Cancel</button>
        </div>
    </div>
</body>
</html>
